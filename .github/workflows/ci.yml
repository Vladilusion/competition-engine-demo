name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: PHP syntax
        run: find config public src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Domain and application tests
        run: php tests/run.php
      - name: Validate SQL fixtures
        run: docker run -d --name mysql -e MYSQL_ROOT_PASSWORD=root -p 3306:3306 mysql:8.4 && for i in {1..30}; do docker exec mysql mysqladmin ping -proot --silent && break; sleep 2; done && docker exec -i mysql mysql -uroot -proot < database/schema.sql && docker exec -i mysql mysql -uroot -proot < database/seed.sql
