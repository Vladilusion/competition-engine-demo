services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: competition_demo
      MYSQL_USER: competition
      MYSQL_PASSWORD: competition
    ports: ["3306:3306"]
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - competition-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h127.0.0.1 -u$$MYSQL_USER -D$$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 15s
  app:
    image: php:8.2-cli
    working_dir: /app
    command: sh -c "docker-php-ext-install pdo_mysql && php -S 0.0.0.0:8080 -t public"
    environment:
      DB_DSN: mysql:host=database;port=3306;dbname=competition_demo;charset=utf8mb4
      DB_USER: competition
      DB_PASSWORD: competition
      ADMIN_TOKEN: local-demo-admin
    ports: ["8080:8080"]
    volumes: [".:/app"]
    depends_on:
      database:
        condition: service_healthy
volumes:
  competition-data:
